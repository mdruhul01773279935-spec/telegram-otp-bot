# Render.com deployment.
# NOTE: Render has no *free* background workers - only free *web* services.
# A free web service sleeps after ~15 min without HTTP traffic, so point a free
# uptime pinger (UptimeRobot / cron-job.org) at  https://<your-app>.onrender.com/health
# The bot serves that page automatically when the PORT env var is set (Render sets it).
services:
  - type: web
    name: telegram-otp-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false            # you will be asked to enter it
      - key: ADMIN_IDS
        sync: false            # optional: your Telegram user id
